name: Coleta PNCP

# O radar só vale se rodar sozinho. Sem VPS, o agendador de graça que já
# existe é o próprio GitHub Actions: ele bate na rota /api/sync do app
# publicado, que faz todo o trabalho.
#
# Cada execução lê um pedaço e grava onde parou (tabela coleta_estado), então
# o ciclo completo fecha ao longo de várias execuções. Uma execução curta não
# é falha — é o desenho.
on:
  schedule:
    # de hora em hora. Repositório privado gasta minutos de Actions e o
    # GitHub arredonda para 1 minuto por execução: 24/dia = ~720 min/mês,
    # dentro dos 2.000 gratuitos. Não aumente muito a frequência sem olhar
    # a cota — ou deixe o repositório público, que aí é ilimitado.
    - cron: "0 * * * *"
  # permite disparar à mão pela aba Actions
  workflow_dispatch:

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/sync
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail

          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Faltam os secrets APP_URL e/ou CRON_SECRET no repositório."
            exit 1
          fi

          # --max-time acima do teto da função (60s) para o curl não desistir
          # antes de a Vercel responder.
          corpo=$(curl -sS --max-time 120 \
            -w '\n%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/sync")

          http=$(printf '%s' "$corpo" | tail -n1)
          json=$(printf '%s' "$corpo" | sed '$d')

          echo "HTTP $http"
          echo "$json"

          # 500 é veredito do próprio handler: varredura que não vale como
          # resultado (não leu nada, perdeu uma fatia inteira, ou pulou mais
          # de um quinto das páginas). Falhar aqui faz o GitHub te avisar,
          # em vez de acumular coletas vazias em silêncio.
          if [ "$http" != "200" ]; then
            echo "::error::A coleta não passou (HTTP $http)."
            exit 1
          fi
